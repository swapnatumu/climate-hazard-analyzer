# Render blueprint for the API. Dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: climate-hazard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Proxy headers so per-IP rate limiting sees the real client address.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_DB
        value: climate
      # Set these two in the Render dashboard; they are never committed.
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
