# Render blueprint for the API. Dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: climate-hazard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_DB
        value: climate
      # Per-IP rate limiting reads the client address from this header. Cloudflare (in front
      # of Render) overwrites it on every request; X-Forwarded-For can be forged by the client.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Set these two in the Render dashboard; they are never committed.
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
